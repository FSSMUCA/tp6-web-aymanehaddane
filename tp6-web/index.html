<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculatrice Web</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Calculatrice</h1>
    </header>

    <main>
        <section class="card">

            <form id="calcForm">
                <label>Nombre A :</label>
                <input type="number" id="numberA">

                <label>Nombre B :</label>
                <input type="number" id="numberB">

                <label id="ch-op"> Choisissez l’opération que vous voulez  <br> <span class="fleche">↓</span> </label>
                <select id="operation">
                    <option value="empty" disabled selected>--opération--</option>
                    <option value="+">Addition (+)</option>
                    <option value="-">Soustraction (-)</option>
                    <option value="*">Multiplication (×)</option>
                    <option value="/">Division (÷)</option>
                </select>
                 <div class="btn">

                     <button type="submit">Calculer</button>
                 </div>
            </form>

            
        </section>

        <section class="card">
            <h2>Historique des opérations</h2>
            <ul id="history"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; BY AYMANE </p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
